# Hooks run by `prek` (https://prek.j178.dev), the Rust pre-commit
# replacement. Schema: https://www.schemastore.org/prek.json
#
# Install once per clone:  prek install
# Run against the repo:    prek run --all-files
# Run against staged only: prek run
#
# `repo = "builtin"` uses prek's bundled hooks — no remote install.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg"]
fail_fast = false

# --- Whitespace, syntax, hygiene --------------------------------------
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "check-merge-conflict" },
    { id = "check-case-conflict" },
    { id = "check-added-large-files", args = ["--maxkb=500"] },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-json" },
    { id = "detect-private-key" },
]

# --- Secret scanning --------------------------------------------------
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.21.2"
hooks = [{ id = "gitleaks" }]

# --- Tap conventions --------------------------------------------------
# Each hook is its own table so the entry= shell scripts can use
# triple-single-quoted literal strings (no escaping headaches).

[[repos]]
repo = "local"

# ADR 0005 — only .env.template is allowed; raw .env files at any path
# are forbidden.
[[repos.hooks]]
id = "forbid-env-files"
name = "forbid raw .env files (.env.template only)"
entry = '''bash -c 'for f in "$@"; do b=$(basename "$f"); case "$b" in .env.template) ;; .env|.env.*) echo "Forbidden .env file staged: $f (only .env.template allowed)"; exit 1;; esac; done' --'''
language = "system"
pass_filenames = true

# Convention drift detector. Requires `jwa-tobrew` on PATH — install via
# `brew install jwa91/tap/jwa-tobrew` (or `brew bundle install --file
# ~/dotfiles/Brewfile`). The source no longer lives in this repo (ADR 0008),
# so there is no `go run` fallback.
[[repos.hooks]]
id = "jwa-tobrew-align"
name = "jwa-tobrew align (no drift)"
entry = '''bash -c 'cd "$(git rev-parse --show-toplevel)" && command -v jwa-tobrew >/dev/null || { echo "jwa-tobrew not installed: brew install jwa91/tap/jwa-tobrew"; exit 1; }; jwa-tobrew align' '''
language = "system"
files = '^(\.agents/skills/|\.claude/skills/|docs/adr/|docs/migration-|Casks/|Formula/)|^(README|CHANGELOG)\.md$'
pass_filenames = false

# --- Commit message ---------------------------------------------------
[[repos]]
repo = "local"

[[repos.hooks]]
id = "conventional-commit"
name = "conventional commit subject"
entry = '''bash -c 'first=$(head -n1 "$1"); if ! echo "$first" | grep -qE "^(feat|fix|chore|docs|refactor|test|perf|build|ci|style|revert)(\(.+\))?!?: .+"; then echo "Subject must follow Conventional Commits:"; echo "  <type>[(scope)][!]: <subject>"; echo "Allowed types: feat fix chore docs refactor test perf build ci style revert"; echo "Got: $first"; exit 1; fi' --'''
language = "system"
stages = ["commit-msg"]
