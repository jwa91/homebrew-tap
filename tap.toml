# tap.toml — committed manifest of items in this tap.
# Regenerate with `jwa-tobrew config`. Source of truth is the .rb files under Casks/ and Formula/.

[tap]
owner = "jwa91"
name  = "tap"

[[items]]
name    = "prehandover"
kind    = "formula"
source  = "github.com/jwa91/prehandover"
version = "0.1.0"
asset   = "prehandover_Darwin_x86_64.tar.gz"
desc    = "Unified agent-stop validation for repo-owned agent harness contracts"

[[items]]
name    = "trnscrb"
kind    = "cask"
source  = "github.com/jwa91/trnscrb"
version = "0.4.1"
asset   = "trnscrb-#{version}.dmg"
desc    = "Drop audio, PDFs, and images onto your menu bar to get markdown back"
deps    = ["macos: \">= :tahoe\""]
