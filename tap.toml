# tap.toml — committed manifest of items in this tap.
# Regenerate with `jwa-tobrew config`. Source of truth is the .rb files under Casks/ and Formula/.

[tap]
owner = "jwa91"
name  = "tap"

[[items]]
name    = "agentskills"
kind    = "cask"
source  = "github.com/jwa91/agentskills"
version = "0.1.4"
asset   = "agentskills_#{version}_darwin_amd64.tar.gz"
desc    = "Install and manage agent skills inside a project"
deps    = ["formula: ["]

[[items]]
name    = "jwa-harden"
kind    = "cask"
source  = "github.com/jwa91/jwa-harden"
version = "0.1.5"
asset   = "jwa-harden_#{version}_darwin_amd64.tar.gz"
desc    = "Wrap a command with op run against the nearest .env.template"

[[items]]
name    = "jwa-tobrew"
kind    = "cask"
source  = "github.com/jwa91/jwa-tobrew"
version = "0.5.0"
asset   = "jwa-tobrew_#{version}_darwin_amd64.tar.gz"
desc    = "Release a project to the personal jwa91/tap Homebrew tap"
deps    = ["formula: ["]

[[items]]
name    = "prehandover"
kind    = "cask"
source  = "github.com/jwa91/prehandover"
version = "0.1.2"
asset   = "prehandover_#{version}_darwin_amd64.tar.gz"
desc    = "Unified agent-stop validation for repo-owned agent harness contracts"

[[items]]
name    = "trnscrb"
kind    = "cask"
source  = "github.com/jwa91/trnscrb"
version = "0.4.1"
asset   = "trnscrb-#{version}.dmg"
desc    = "Drop audio, PDFs, and images onto your menu bar to get markdown back"
deps    = ["macos: \">= :tahoe\""]
